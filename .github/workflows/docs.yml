name: Documentation
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mach-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - run: pip install -r requirements-test.txt
      - name: Configure bounded HTTPS Ubuntu dependency downloads
        run: |
          python -m unittest discover -s scripts -p test_configure_ci_apt.py
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/configure_ci_apt.py
      - name: Install WebKit for mobile SVG regression checks
        timeout-minutes: 5
        run: python -m playwright install --with-deps webkit
      - run: npm ci --prefix ci --ignore-scripts
      - name: Restore display image cache
        id: display-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/media
          key: display-v2-${{ hashFiles('scripts/prepare_site.py') }}-${{ github.sha }}
          restore-keys: |
            display-v2-${{ hashFiles('scripts/prepare_site.py') }}-
      - run: zensical build --clean
      - run: python scripts/prepare_site.py
      - name: Check built-site links and media
        run: python scripts/check_site_media.py
      - name: Check landing-page SEO metadata
        run: python scripts/check_site_seo.py
      # Save only successfully prepared/validated deterministic media. A later
      # browser or Lighthouse failure must not force re-encoding it next run.
      - name: Save validated display image cache
        if: steps.display-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/media
          key: ${{ steps.display-cache.outputs.cache-primary-key }}
      - name: Start local preview
        run: python scripts/serve_site.py > /tmp/mach-preview.log 2>&1 &
      - name: Check browser interactions and accessibility
        run: |
          python -m unittest discover -s scripts -p test_prepare_site.py
          python -m unittest discover -s scripts -p test_hero_logo_delivery.py
          python -m unittest discover -s scripts -p test_portrait_delivery.py
          python scripts/check_team_portraits.py --url http://127.0.0.1:8876 --widths 390 601 1440 --scheme light
          python scripts/check_team_portraits.py --url http://127.0.0.1:8876 --browser webkit --widths 390 601 1440 --scheme dark
          python scripts/check_home_startup.py
          python scripts/check_home_navigation.py --quick
          python scripts/check_logo_navigation.py --quick
          python scripts/check_search.py
          python scripts/check_site_interactions.py --quick
          python scripts/check_october_4_page.py --url http://127.0.0.1:8876 --quick
          python scripts/check_sponsor_artwork.py --quick
          python scripts/check_aqua_artwork.py --browser chromium
          python scripts/check_aqua_artwork.py --browser webkit
      - name: Run key-page Lighthouse checks
        run: node scripts/check_lighthouse.mjs
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
