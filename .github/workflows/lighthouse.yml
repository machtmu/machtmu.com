name: Full site audit
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: full-site-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - run: pip install -r requirements-test.txt
      - run: npm ci --prefix ci --ignore-scripts
      - run: zensical build --clean
      - run: python scripts/prepare_site.py
      - run: python scripts/check_site_media.py
      - run: python scripts/check_site_seo.py
      - run: python scripts/serve_site.py > /tmp/mach-preview.log 2>&1 &
      - run: python scripts/check_search.py
      - run: python scripts/check_site_interactions.py
      - run: python scripts/check_october_4_page.py --url http://127.0.0.1:8876
      - run: python scripts/check_sponsor_artwork.py
      - run: node scripts/check_lighthouse.mjs --full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14
