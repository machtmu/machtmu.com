[project]
site_name        = "MACH"
site_description = "MACH is TMU Rocketry, a Toronto rocketry team building liquid propulsion, avionics, and test systems."
site_author      = "Mach"
site_url         = "https://machtmu.com/"
repo_url         = "https://github.com/machtmu/machtmu.com"
edit_uri         = "edit/main/docs/"
copyright        = "MACH - TMU Liquid Rocketry © 2026"
nav = [
  { "MACH" = "index.md" },
  { "Team" = "team.md" },
  { "Resources" = "resources.md" },
  { "Sponsors" = "sponsors.md" },
  { "GAR-E" = [
      { "Overview" = "GAR-E/index.md" },
      { "Cold Flow - August 19th–20th, 2023" = "GAR-E/coldflow-2023-08-19/index.md" },
      { "Hot Fire - August 30th, 2023" = "GAR-E/hotfire-2023-08-30/index.md" },
      { "Hot Fire - November 19th, 2023" = "GAR-E/hotfire-2023-11-19/index.md" },
      { "Cold Flow - July 14th, 2024" = "GAR-E/coldflow-2024-07-14/index.md" },
      { "Hot Fire - August 22nd, 2024" = "GAR-E/hotfire-2024-08-22/index.md" },
      { "Hot Fire - September 28th, 2024" = "GAR-E/hotfire-2024-09-28/index.md" },
    ] },
  { "SPRINT" = [
      { "Overview" = "SPRINT/index.md" },
      { "Propulsion" = "SPRINT/propulsion.md" },
      { "Electronics" = "SPRINT/electronics.md" },
      { "Avionics" = "SPRINT/avionics/index.md" },
      { "Cold Flow - August 9th, 2025" = "SPRINT/aug-19-coldflow.md" },
      { "Hot Fire - August 22nd, 2025" = "SPRINT/aug-22-hotfire.md" },
      { "Hot Fire - September 13th and 14th, 2025" = "SPRINT/sept-13-hotfire.md" },
      { "Cold Flow - November 7th, 2025" = "SPRINT/nov-7-coldflow.md" },
      { "Cold Flow - November 20th, 2025" = "SPRINT/nov-20-coldflow.md" },
      { "Hot Fire - December 15th and 16th, 2025" = "SPRINT/dec-15-16-hotfire.md" },
    ] },
  { "Seraphina" = [
      { "Overview" = "Seraphina/index.md" },
      { "Hot Fire - August 6th, 2026" = "Seraphina/aug-6-hotfire.md" },
    ] },
]


# Extra styling / scripts
extra_css = [
  "css/extra.css",
]

extra_javascript = [
  "js/home.js",
  "js/site.js",
]



[project.extra]
generator = false
location = "Toronto, Canada · TMU KNH03 (Dungeon)"

# Social icons in the footer
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/machtmu/"

[[project.extra.social]]
icon = "fontawesome/brands/instagram"
link = "https://www.instagram.com/machtmu/"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/tmurocketry/"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/3kak7Ydu43"

[[project.extra.social]]
icon = "fontawesome/brands/twitch"
link = "https://www.twitch.tv/machtmu"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
link = "https://www.youtube.com/@machtmu"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:mach@torontomu.com"
name = "Email MACH"

# -----------------------------------------------------------------------------
# THEME – using Zensical's modern look
# -----------------------------------------------------------------------------

[project.theme]
# "modern" is the new look; explicit here so it's obvious

# If your overrides are heavily tuned to old Material, you can comment this out
# to see the pure modern look first and re-enable once you've adjusted them.
custom_dir = "overrides"
logo    = "img/logo1.png"
favicon = "img/favicon.ico"

features = [
  # Header / announcement
  "announce.dismiss",

  # Code goodies
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",

  # Tooltips / tabs / footnotes (nice modern UX touches)
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",

  # Header behavior
  "header.autohide",

  # Navigation
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",

  # Search
  "search.highlight",

  # TOC behavior
  "toc.follow",
]

[project.theme.icon]
# Use repo icon in header (Zensical will still infer some things from repo_url)
repo = "fontawesome/brands/github"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# If you want MACH-black accent later:
# primary = "black"  # under each palette block

# -----------------------------------------------------------------------------
# PLUGINS
# -----------------------------------------------------------------------------

# Meta plugin
[project.plugins.meta]

# Git revision date (same behavior as in mkdocs.yml)
[project.plugins."git-revision-date-localized"]
enable_creation_date = true
timezone             = "America/Toronto"

# Table-reader plugin
[project.plugins."table-reader"]

# (Not needed: Zensical already has search built in, so no "search" plugin here)

# -----------------------------------------------------------------------------
# MARKDOWN EXTENSIONS
# -----------------------------------------------------------------------------

# Direct ports of your pymdownx + friends.
# These tables mirror `markdown_extensions:` from mkdocs.yml.

[project.markdown_extensions."pymdownx.caret"]
[project.markdown_extensions."pymdownx.mark"]
[project.markdown_extensions."pymdownx.tilde"]

[project.markdown_extensions."pymdownx.arithmatex"]
generic = true

[project.markdown_extensions.attr_list]

# Use Zensical's emoji helpers (same visuals as Material, but new path) :contentReference[oaicite:2]{index=2}
[project.markdown_extensions."pymdownx.emoji"]
emoji_index     = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true

[project.markdown_extensions.md_in_html]

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums     = true
line_spans          = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.snippets"]
[project.markdown_extensions."pymdownx.superfences"]

# Optional: enable Zensical's own instant-preview extension later:
# [project.markdown_extensions."zensical.extensions.preview"]
# configurations = [
#   { targets.include = ["customization.md", "setup/extensions/*"] }
# ]

